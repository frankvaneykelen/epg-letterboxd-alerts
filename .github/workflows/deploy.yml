name: Deploy to Azure Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install azure-functions-core-tools

      - name: Run tests
        run: |
          # Add test commands here when tests are created
          echo "Tests not yet implemented"

      - name: Create package
        run: |
          mkdir -p dist
          zip -r dist/epg-letterboxd-alerts.zip . -x ".git*" "dist/*" ".venv/*" "*.pyc" "__pycache__/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: dist/epg-letterboxd-alerts.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: function-package

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: epg-letterboxd-alerts.zip
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}

      - name: Post deployment message
        run: |
          echo "Successfully deployed epg-letterboxd-alerts to Azure Functions"
