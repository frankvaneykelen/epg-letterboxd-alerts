# Ziggo Netherlands EPG Configuration
# URLs for accessing Ziggo's EPG service
# NOTE: These are unofficial/reverse-engineered endpoints and can change
# without notice. If segment fetch starts returning 500/504 HTML pages,
# check README Endpoint Volatility Warning and upstream:
# - https://github.com/jbogers/ziggogo-epg/issues/10
# - https://webgrabplus.com/content/ziggo

urls:
  epg_channel_list: https://spark-prod-nl.gnp.cloud.ziggogo.tv/eng/web/linear-service/v2/channels?cityId=65535&language=nl&productClass=Orion-DASH
  epg_segment: https://staticqbr-prod-nl.gnp.cloud.ziggogo.tv/nld/web/epg-service-lite/nl/nl/events/segments/{}
  epg_detail: https://spark-prod-nl.gnp.cloud.ziggogo.tv/eng/web/linear-service/v2/replayEvent/{}?returnLinearContent=true&language=nl

# Timezone for XMLTV timestamps
timezone: Europe/Amsterdam
